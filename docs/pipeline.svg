<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Pipeline: prompt and cameras, five stages, grasp and placement chosen together, pick and place</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .name { font-size: 24px; font-weight: 700; fill: #111827; }
      .sub { font-size: 19px; fill: #374151; }
      .num { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .wire { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .perc { fill: #EAF2FF; stroke: #2F6FDB; stroke-width: 2; }
      .plan { fill: #FFF4E0; stroke: #D98A00; stroke-width: 2; }
      .exec { fill: #F2ECFF; stroke: #7C4DDB; stroke-width: 2; }
      .input { fill: #F3F4F6; stroke: #9AA3AF; stroke-width: 2; }
    </style>
  </defs>

  <!-- solid card: readable in GitHub's light and dark themes -->
  <rect x="1" y="1" width="1198" height="518" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <!-- inputs -->
  <rect x="24" y="40" width="200" height="96" rx="12" class="input"/>
  <text x="44" y="80" class="name">Prompt</text>
  <text x="44" y="112" class="sub">phrase or image</text>

  <rect x="24" y="212" width="200" height="96" rx="12" class="input"/>
  <text x="44" y="252" class="name">Fixed camera</text>
  <text x="44" y="284" class="sub">RGB-D, table</text>

  <rect x="24" y="384" width="200" height="96" rx="12" class="input"/>
  <text x="44" y="424" class="name">Wrist camera</text>
  <text x="44" y="456" class="sub">RGB-D, shelf</text>

  <!-- 1 Detect -->
  <rect x="280" y="40" width="240" height="96" rx="12" class="perc"/>
  <circle cx="308" cy="72" r="16" fill="#2F6FDB"/><text x="308" y="78" class="num" text-anchor="middle">1</text>
  <text x="334" y="80" class="name">Detect</text>
  <text x="300" y="116" class="sub">YOLOE-seg → mask</text>

  <!-- 2 Pose -->
  <rect x="576" y="40" width="240" height="96" rx="12" class="perc"/>
  <circle cx="604" cy="72" r="16" fill="#2F6FDB"/><text x="604" y="78" class="num" text-anchor="middle">2</text>
  <text x="630" y="80" class="name">Pose</text>
  <text x="596" y="116" class="sub">FoundationPose</text>

  <!-- 3 Table -->
  <rect x="280" y="212" width="240" height="96" rx="12" class="perc"/>
  <circle cx="308" cy="244" r="16" fill="#2F6FDB"/><text x="308" y="250" class="num" text-anchor="middle">3</text>
  <text x="334" y="252" class="name">Table</text>
  <text x="300" y="288" class="sub">RANSAC plane</text>

  <!-- 4 Grasp -->
  <rect x="576" y="212" width="240" height="96" rx="12" class="plan"/>
  <circle cx="604" cy="244" r="16" fill="#D98A00"/><text x="604" y="250" class="num" text-anchor="middle">4</text>
  <text x="630" y="252" class="name">Grasp</text>
  <text x="596" y="288" class="sub">jaw candidates</text>

  <!-- 5 Place -->
  <rect x="280" y="384" width="240" height="96" rx="12" class="perc"/>
  <circle cx="308" cy="416" r="16" fill="#2F6FDB"/><text x="308" y="422" class="num" text-anchor="middle">5</text>
  <text x="334" y="424" class="name">Place</text>
  <text x="300" y="460" class="sub">shelf RANSAC</text>

  <!-- choose together -->
  <rect x="872" y="212" width="304" height="96" rx="12" class="plan"/>
  <text x="892" y="252" class="name">Choose together</text>
  <text x="892" y="288" class="sub">grasp + placement</text>

  <!-- execute -->
  <rect x="872" y="384" width="304" height="96" rx="12" class="exec"/>
  <text x="892" y="424" class="name">Pick → Place</text>
  <text x="892" y="460" class="sub">MoveIt 2 · Isaac Sim</text>

  <!-- wires -->
  <path d="M224,76 H278" class="wire"/>
  <path d="M224,236 H246 V112 H278" class="wire"/>
  <path d="M224,260 H278" class="wire"/>
  <path d="M520,88 H574" class="wire"/>
  <path d="M696,136 V210" class="wire"/>
  <path d="M520,260 H574" class="wire"/>
  <path d="M816,248 H870" class="wire"/>
  <path d="M224,432 H278" class="wire"/>
  <path d="M520,432 H844 V276 H870" class="wire"/>
  <path d="M1024,308 V382" class="wire"/>
</svg>
