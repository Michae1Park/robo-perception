oke-width:.6"/><rect class="b" x="54" y="376" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="66" y="376" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="78" y="376" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="90" y="376" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="102" y="376" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="114" y="376" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="126" y="376" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="42" y="388" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="54" y="388" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="66" y="388" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="78" y="388" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="90" y="388" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="102" y="388" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="114" y="388" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="126" y="388" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="42" y="400" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="54" y="400" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="66" y="400" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="78" y="400" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="90" y="400" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="102" y="400" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="114" y="400" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="126" y="400" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="42" y="412" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="54" y="412" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="66" y="412" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="78" y="412" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="90" y="412" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="102" y="412" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="114" y="412" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="126" y="412" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="42" y="424" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="54" y="424" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="66" y="424" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="78" y="424" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="90" y="424" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="102" y="424" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="114" y="424" width="12" height="12" style="stroke-width:.6"/><rect class="b" x="126" y="424" width="12" height="12" style="stroke-width:.6"/><rect class="cellhi" x="114" y="364" width="12" height="12"/><rect class="bc" x="205" y="330" width="26" height="215" rx="3"/><line class="stripline" x1="205" y1="338" x2="231" y2="338"/><line class="stripline" x1="205" y1="346" x2="231" y2="346"/><line class="stripline" x1="205" y1="354" x2="231" y2="354"/><line class="stripline" x1="205" y1="362" x2="231" y2="362"/><line class="stripline" x1="205" y1="370" x2="231" y2="370"/><line class="stripline" x1="205" y1="378" x2="231" y2="378"/><line class="stripline" x1="205" y1="386" x2="231" y2="386"/><line class="stripline" x1="205" y1="394" x2="231" y2="394"/><line class="stripline" x1="205" y1="402" x2="231" y2="402"/><line class="stripline" x1="205" y1="410" x2="231" y2="410"/><line class="stripline" x1="205" y1="418" x2="231" y2="418"/><line class="stripline" x1="205" y1="426" x2="231" y2="426"/><line class="stripline" x1="205" y1="434" x2="231" y2="434"/><line class="stripline" x1="205" y1="442" x2="231" y2="442"/><line class="stripline" x1="205" y1="450" x2="231" y2="450"/><line class="stripline" x1="205" y1="458" x2="231" y2="458"/><line class="stripline" x1="205" y1="466" x2="231" y2="466"/><line class="stripline" x1="205" y1="474" x2="231" y2="474"/><line class="stripline" x1="205" y1="482" x2="231" y2="482"/><line class="stripline" x1="205" y1="490" x2="231" y2="490"/><line class="stripline" x1="205" y1="498" x2="231" y2="498"/><line class="stripline" x1="205" y1="506" x2="231" y2="506"/><line class="stripline" x1="205" y1="514" x2="231" y2="514"/><line class="stripline" x1="205" y1="522" x2="231" y2="522"/><line class="stripline" x1="205" y1="530" x2="231" y2="530"/><line class="stripline" x1="205" y1="538" x2="231" y2="538"/>
        
        <text class="ts" x="90" y="490" text-anchor="middle">80×80 grid (drawn 8×8)</text>
        <text class="ts" x="90" y="505" text-anchor="middle">highlighted = one cell</text>
        <path class="ac" d="M117 373 C160 373 170 440 203 440" marker-end="url(#h1c)"/>
        <text class="tc" x="218" y="560" text-anchor="middle">256 numbers</text>
        <text class="ts" x="218" y="575" text-anchor="middle">this cell's</text>
        <text class="ts" x="218" y="589" text-anchor="middle">class feature</text>

        <!-- fork -->
        <path class="av" d="M231 440 C258 440 258 375 288 375" marker-end="url(#h1v)"/>
        <path class="ap" d="M231 440 C258 440 258 535 288 535" marker-end="url(#h1p)"/>

        <!-- prompted lane -->
        <text class="lane-v" x="290" y="330">TEXT- OR VISUAL-PROMPTED · yoloe-11l-seg.pt</text>
        <rect class="bv" x="290" y="345" width="110" height="60" rx="4"/>
        <text class="tb" x="345" y="370" text-anchor="middle">project up</text>
        <text class="tm" x="345" y="388" text-anchor="middle">256 → 512</text>
        <line class="av" x1="400" y1="375" x2="438" y2="375" marker-end="url(#h1v)"/>

        <rect class="bv" x="440" y="345" width="170" height="60" rx="4"/>
        <text class="tb" x="525" y="370" text-anchor="middle">compare with prompts</text>
        <text class="ts" x="525" y="388" text-anchor="middle">cv4: dot · ×scale + bias</text>
        <rect class="bd" x="440" y="425" width="170" height="30" rx="4"/>
        <text class="tv" x="525" y="445" text-anchor="middle">N prompt vectors ×512</text>
        <line class="av" x1="525" y1="425" x2="525" y2="407" marker-end="url(#h1v)"/>
        <text class="ts" x="620" y="445">made in Fig 2</text>
        <line class="av" x1="610" y1="375" x2="648" y2="375" marker-end="url(#h1v)"/>

        <rect class="bv" x="650" y="345" width="130" height="60" rx="4"/>
        <text class="tb" x="715" y="370" text-anchor="middle">N scores</text>
        <text class="ts" x="715" y="388" text-anchor="middle">every cell</text>
        <line class="av" x1="780" y1="375" x2="818" y2="375" marker-end="url(#h1v)"/>
        <text class="t" x="822" y="371">best prompt</text>
        <text class="ts" x="822" y="388">keep if &gt; conf</text>

        <!-- prompt-free lane -->
        <text class="lane-p" x="290" y="490">PROMPT-FREE · yoloe-11l-seg-pf.pt</text>
        <rect class="bp" x="290" y="505" width="110" height="60" rx="4"/>
        <text class="tb" x="345" y="530" text-anchor="middle">object?</text>
        <text class="tm" x="345" y="548" text-anchor="middle">lrpc.pf · 1×256</text>
        <line class="ap" x1="400" y1="535" x2="438" y2="535" marker-end="url(#h1p)"/>

        <rect class="bp" x="440" y="505" width="100" height="60" rx="4"/>
        <text class="tb" x="490" y="530" text-anchor="middle">gate</text>
        <text class="ts" x="490" y="548" text-anchor="middle">&gt; conf?</text>
        <line class="ap" x1="540" y1="535" x2="578" y2="535" marker-end="url(#h1p)"/>
        <text class="ts" x="559" y="526" text-anchor="middle">yes</text>
        <path class="ap" d="M490 565 L490 598" stroke-dasharray="3 3" marker-end="url(#h1p)"/>
        <text class="ts" x="500" y="613">no: cell dropped, never named</text>

        <rect class="bp" x="580" y="505" width="150" height="60" rx="4"/>
        <text class="tb" x="655" y="530" text-anchor="middle">compare with vocab</text>
        <text class="tm" x="655" y="548" text-anchor="middle">lrpc.vocab 4,585×256</text>
        <line class="ap" x1="730" y1="535" x2="768" y2="535" marker-end="url(#h1p)"/>

        <rect class="bp" x="770" y="505" width="110" height="60" rx="4"/>
        <text class="tb" x="825" y="530" text-anchor="middle">4,585 scores</text>
        <text class="ts" x="825" y="548" text-anchor="middle">kept cells only</text>
        <line class="ap" x1="880" y1="535" x2="908" y2="535" marker-end="url(#h1p)"/>
        <text class="t" x="912" y="531">top</text>
        <text class="t" x="912" y="547">name</text>
      </svg>