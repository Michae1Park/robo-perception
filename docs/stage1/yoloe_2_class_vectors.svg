<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-label="Text prompts: phrase goes through the MobileCLIP text encoder and the reprta refiner to a 512-number vector. Visual prompts: reference image and box go through the shared trunk and SAVPE to a 512-number vector. Both fill the same N by 512 prompt table. Prompt-free: 4,585 names were encoded and folded before release into a fixed 4,585 by 256 vocabulary."><style>svg{font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.b   { fill: #ffffff; stroke: #18202b; stroke-width: 1.4; }
.bv  { fill: #e1f1f3; stroke: #0b7482; stroke-width: 1.6; }
.bp  { fill: #fbeade; stroke: #b8521a; stroke-width: 1.6; }
.bt  { fill: #eef2dc; stroke: #5a6f12; stroke-width: 1.6; }
.bc  { fill: #ffffff; stroke: #18202b; stroke-width: 2.6; }
.cellhi { fill: #18202b; opacity: .8; }
.stripline { stroke: #b8521a; stroke-width: .6; opacity: .5; }
.big { fill: #18202b; font: 600 22px "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; font-variant-numeric: tabular-nums; }
.blob { fill: #5a6574; opacity: .45; }
.blob2 { fill: #5a6574; opacity: .25; }
.solid { fill: #18202b; }
.cover { fill: #ffffff; }
.bd  { fill: none; stroke: #5a6574; stroke-width: 1.2; stroke-dasharray: 4 3; }
.t   { fill: #18202b; font-size: 13px; }
.tb  { fill: #18202b; font-size: 13px; font-weight: 600; }
.ts  { fill: #5a6574; font-size: 11px; }
.tm  { fill: #5a6574; font-size: 11px; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
.tv  { fill: #0b7482; font-size: 12px; font-weight: 600; }
.tp  { fill: #b8521a; font-size: 12px; font-weight: 600; }
.lane-v { fill: #0b7482; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; }
.lane-t { fill: #5a6f12; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; }
.lane-s { fill: #5a6574; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; }
.tc  { fill: #18202b; font-size: 12px; font-weight: 600; }
.ac  { stroke: #18202b; stroke-width: 2.2; fill: none; }
.lane-p { fill: #b8521a; font: 600 11px "IBM Plex Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; }
.a   { stroke: #18202b; stroke-width: 1.4; fill: none; }
.av  { stroke: #0b7482; stroke-width: 1.8; fill: none; }
.at  { stroke: #5a6f12; stroke-width: 1.8; fill: none; }
.ap  { stroke: #b8521a; stroke-width: 1.8; fill: none; }
.hf  { fill: #18202b; } .hv { fill: #0b7482; } .hp { fill: #b8521a; } .ht { fill: #5a6f12; } .hc { fill: #18202b; }
.rule { stroke: #c3ccd6; stroke-width: 1; }

</style><rect width="100%" height="100%" fill="#ffffff"/>
        <defs>
          <marker id="h3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hf"/></marker>
          <marker id="h3v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hv"/></marker>
          <marker id="h3t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ht"/></marker>
          <marker id="h3p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hp"/></marker>
        </defs>

        <!-- TEXT lane -->
        <text class="lane-t" x="20" y="28">TEXT-PROMPTED · yoloe-11l-seg.pt · on your machine, per phrase</text>
        <rect class="b" x="20" y="45" width="130" height="70" rx="4"/>
        <text class="tb" x="85" y="73" text-anchor="middle">phrase</text>
        <text class="ts" x="85" y="91" text-anchor="middle">"mustard bottle"</text>
        <text class="ts" x="85" y="106" text-anchor="middle">→ 77 tokens</text>
        <line class="at" x1="150" y1="80" x2="188" y2="80" marker-end="url(#h3t)"/>

        <rect class="bt" x="190" y="45" width="150" height="70" rx="4"/>
        <text class="tb" x="265" y="73" text-anchor="middle">MobileCLIP text</text>
        <text class="tm" x="265" y="91" text-anchor="middle">mobileclip_blt.ts</text>
        <text class="ts" x="265" y="106" text-anchor="middle">separate 600 MB file</text>
        <line class="at" x1="340" y1="80" x2="388" y2="80" marker-end="url(#h3t)"/>
        <text class="ts" x="364" y="71" text-anchor="middle">512</text>

        <rect class="bt" x="390" y="45" width="170" height="70" rx="4"/>
        <text class="tb" x="475" y="73" text-anchor="middle">reprta refiner</text>
        <text class="tm" x="475" y="91" text-anchor="middle">512→2048→512 +skip</text>
        <text class="ts" x="475" y="106" text-anchor="middle">1.6M params, in the .pt</text>
        <line class="at" x1="560" y1="80" x2="608" y2="80" marker-end="url(#h3t)"/>

        <rect class="bt" x="610" y="45" width="140" height="70" rx="4"/>
        <text class="tb" x="680" y="73" text-anchor="middle">1 vector ×512</text>
        <text class="ts" x="680" y="91" text-anchor="middle">normalised</text>
        <path class="at" d="M750 80 C785 80 785 145 805 145" marker-end="url(#h3t)"/>

        <!-- shared table -->
        <rect class="bd" x="808" y="112" width="152" height="66" rx="4"/>
        <text class="tb" x="884" y="137" text-anchor="middle">N×512</text>
        <text class="tb" x="884" y="154" text-anchor="middle">prompt table</text>
        <text class="ts" x="884" y="170" text-anchor="middle">→ Fig 1, top lane</text>

        <!-- VISUAL lane -->
        <text class="lane-v" x="20" y="168">VISUAL-PROMPTED · yoloe-11l-seg.pt · on your machine, per ref (~1.4 s)</text>
        <rect class="b" x="20" y="185" width="130" height="70" rx="4"/>
        <text class="tb" x="85" y="213" text-anchor="middle">ref image</text>
        <text class="ts" x="85" y="231" text-anchor="middle">+ box around</text>
        <text class="ts" x="85" y="246" text-anchor="middle">the object</text>
        <line class="a" x1="150" y1="220" x2="188" y2="220" marker-end="url(#h3)"/>

        <rect class="b" x="190" y="185" width="150" height="70" rx="4"/>
        <text class="tb" x="265" y="213" text-anchor="middle">backbone + neck</text>
        <text class="ts" x="265" y="231" text-anchor="middle">same trunk as Fig 1</text>
        <line class="av" x1="340" y1="220" x2="388" y2="220" marker-end="url(#h3v)"/>

        <rect class="bv" x="390" y="185" width="170" height="70" rx="4"/>
        <text class="tb" x="475" y="213" text-anchor="middle">SAVPE</text>
        <text class="tm" x="475" y="231" text-anchor="middle">5.6M params</text>
        <text class="ts" x="475" y="246" text-anchor="middle">pools features inside box</text>
        <line class="av" x1="560" y1="220" x2="608" y2="220" marker-end="url(#h3v)"/>

        <rect class="bv" x="610" y="185" width="140" height="70" rx="4"/>
        <text class="tb" x="680" y="213" text-anchor="middle">1 vector ×512</text>
        <text class="ts" x="680" y="231" text-anchor="middle">normalised</text>
        <path class="av" d="M750 220 C785 220 785 160 805 160" marker-end="url(#h3v)"/>

        <line class="rule" x1="20" y1="290" x2="960" y2="290"/>

        <!-- PF lane -->
        <text class="lane-p" x="20" y="320">PROMPT-FREE · yoloe-11l-seg-pf.pt · done once by the YOLOE authors, before release</text>
        <rect class="b" x="20" y="337" width="130" height="70" rx="4"/>
        <text class="tb" x="85" y="365" text-anchor="middle">4,585 names</text>
        <text class="ts" x="85" y="383" text-anchor="middle">"bottle", "banana",</text>
        <text class="ts" x="85" y="398" text-anchor="middle">"workbench", …</text>
        <line class="a" x1="150" y1="372" x2="188" y2="372" marker-end="url(#h3)"/>

        <rect class="b" x="190" y="337" width="150" height="70" rx="4"/>
        <text class="tb" x="265" y="365" text-anchor="middle">text encoder</text>
        <text class="ts" x="265" y="383" text-anchor="middle">4,585 vectors ×512</text>
        <line class="ap" x1="340" y1="372" x2="388" y2="372" marker-end="url(#h3p)"/>

        <rect class="bp" x="390" y="337" width="170" height="70" rx="4"/>
        <text class="tb" x="475" y="365" text-anchor="middle">fold in cv3.*.2 + cv4</text>
        <text class="ts" x="475" y="383" text-anchor="middle">pre-multiplied, so the</text>
        <text class="ts" x="475" y="398" text-anchor="middle">512-d step disappears</text>
        <line class="ap" x1="560" y1="372" x2="608" y2="372" marker-end="url(#h3p)"/>

        <rect class="bp" x="610" y="337" width="140" height="70" rx="4"/>
        <text class="tb" x="680" y="365" text-anchor="middle">lrpc.*.vocab</text>
        <text class="tm" x="680" y="383" text-anchor="middle">4,585 × 256</text>
        <line class="ap" x1="750" y1="372" x2="788" y2="372" marker-end="url(#h3p)"/>
        <text class="tp" x="792" y="368">stored in the .pt;</text>
        <text class="tp" x="792" y="385">→ Fig 1, bottom lane</text>
        <text class="ts" x="20" y="445">Text and visual rows can be mixed in one table: each row is just 512 numbers, and the compare head can't tell where a row came from.</text>
      </svg>