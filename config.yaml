# All tunable parameters: vision stages, gripper, sim cell. Units: metres, degrees.
# Read through vision.load_config() (pipeline/, sim/, ROS nodes and launch files).

detect:                       # stage 1 (YOLOE) - used by every stage 1 script + the notebook
  weights: yoloe-11l-seg.pt   # file in models/ (auto-downloaded). yoloe-11s/m/l-seg.pt: s = faster, l = more accurate
  conf: 0.05                  # drop detections scoring below this (precision/recall dial)
  iou: 0.7                    # NMS: overlapping boxes above this IoU are merged (lower = fewer duplicates)
  imgsz: 640                  # inference resolution (higher = small objects + finer masks, slower)
  max_det: 300                # keep at most this many detections
  half: false                 # FP16 inference
  device: cuda:0

  # ROS detect_node, prompt "visual+text": each visual-prompt detection is checked by a text-prompt model with the
  # target's name plus a generic vocabulary; score = visual + text(target) - text(best other name) on the same mask
  vocabulary: [can, tin can, box, bottle, cup, bowl, toy, block, cube, fruit, tool, packet]
  min_fused: -0.25            # below: rejected. 24 sim scenes: 20 accepted, all right; the 4 rejected were all wrong

pose:                         # stage 2 (FoundationPose)
  iterations: 5               # refinement iterations

spatial:                      # stage 3 (table plane + occupancy grid)
  ransac_dist: 0.006          # point-to-plane distance counted as inlier
  ransac_iters: 300
  min_inliers: 500
  resolution: 0.01            # occupancy cell size
  height_thresh: 0.012        # higher than this above the plane = obstacle
  max_height: 0.6             # ignore points above this

gripper:                      # Franka Hand (stage 4, the task, the sim, MoveIt's robot model)
  max_opening: 0.08           # total finger opening
  finger_depth: 0.045         # how far the pads' centre goes past the grasped face (capped at half the object)
  finger_extension: 0.05      # fingers this much longer than stock (sim/cell.py + MoveIt URDF); TCP 0.1034 -> 0.1534

robot:                        # Franka Panda joint poses (rad), used by the task and the sim
  # home faces between the table and the shelf (joint 1 at -45 deg, D-035): both are a short turn away, and IK
  # seeded from here lands in the natural elbow-up, wrist-down configuration
  home_joints: [-0.785, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785]
  look_joints: [-1.257, -0.88, 0.217, -1.445, -0.143, 1.164, 1.193]   # wrist camera at (0.12, -0.12, 0.90) looking at (0.12, -0.64, 0.22)

objects:                      # the objects the robot can pick (its mesh: assets/ycb/<name>) and what else it knows about them
  006_mustard_bottle: {}
  005_tomato_soup_can:
    symmetry_axis: z          # rotationally symmetric about its mesh z axis: its estimated roll about it is arbitrary
  077_rubiks_cube: {}
  004_sugar_box: {}
  061_foam_brick: {}

grasp:                        # stage 4 filter
  max_approach_tilt_deg: 50   # approach direction vs. straight down
  width_margin: 0.008         # free opening required beyond the object width
  table_clearance: 0.012      # fingertips must stay this far above the table

place:                        # stage 5 (shelf placement): supports -> free space -> candidates
  max_tilt_deg: 10            # a surface counts as horizontal if its normal is within this of "up"
  ransac_dist: 0.008          # point-to-plane distance counted as "on the surface"
  ransac_iters: 200
  min_inliers: 800            # smaller planes are ignored
  max_planes: 6               # stop after this many horizontal planes
  min_area: 0.01              # m^2: smaller pieces of a plane are ignored
  resolution: 0.01            # grid cell size
  height_thresh: 0.012        # higher than this above a support = obstacle
  max_height: 0.6             # ignore points higher than this above a support
  min_gap: 0.05               # a support this much higher counts as the "ceiling" of the one below
  margin: 0.01                # extra free space around the object's footprint
  hand_clearance: 0.08        # space needed above the object for the gripper when setting it down
  max_reach: 0.85             # Franka: max distance from the shoulder (0, 0, 0.333) to the place point
  per_support: 3              # best candidates kept per support

sim:                          # Isaac Sim cell (sim/cell.py). World frame = robot base (panda_link0): z up, z = 0 is the table top
  # Layout (D-035): the Panda is most comfortable 0.5-0.72 m out (top-down) and with the hand 0.1-0.6 m high (sideways
  # into the shelf), so the objects sit 0.5-0.7 m from the base and the working shelf boards at 0.05 / 0.45 m. Moving
  # the shelf 10-20 cm further away cost placements (D-040). Long, narrow table and a floor-standing pantry: D-041.
  table_center: [0.60, 0.175] # xy of the table centre; its top is at z = 0
  table_size: [0.40, 0.95, 0.75]   # x 0.40..0.80, y -0.30..0.65, height
  objects:                    # YCB items on the table (assets/ycb/<name>). yaw_deg: fixed or [lo, hi] random per frame;
                              # tilt_deg 90 = lying on its side; target: true -> mask + ground-truth pose saved (demo picks)
    - {name: 006_mustard_bottle,  xy: [0.54,  0.08], yaw_deg: [-30, 30], target: true}
    - {name: 005_tomato_soup_can, xy: [0.62, -0.13], yaw_deg: [-180, 180], tilt_deg: 90, target: true}
    - {name: 077_rubiks_cube,     xy: [0.70,  0.18], yaw_deg: 15, target: true}
    - {name: 004_sugar_box,       xy: [0.56,  0.34], yaw_deg: 20, target: true}
    - {name: 061_foam_brick,      xy: [0.45,  0.45], yaw_deg: 45, target: true}
  shelf:                      # metal pantry on the robot's right (-y): corner posts + boards, open back and sides
    center_xy: [0.12, -0.645] # footprint centre: front 0.47 m from the base, back 0.82 m; 0.17 m clear of the table
    size: [0.80, 0.35]        # width (along x), depth (along y)
    levels_z: [-0.35, 0.05, 0.45, 0.95, 1.30]   # board tops (world z; floor at -0.75, 2.05 m tall). 0.38 m clear
                              # above 0.05, 0.48 m above 0.45 (room to carry a tall item in); the Panda works on these two
    board: 0.02               # board thickness
    post: 0.03                # corner post (square)
  shelf_objects:              # items standing on the shelf boards (stage 5 must find the space around them)
    - {name: 004_sugar_box,       level: 1, x: -0.22, yaw_deg: 10}   # x along the shelf width, from its centre
    - {name: 077_rubiks_cube,     level: 2, x:  0.22, yaw_deg: -20}   # no potted meat can anywhere: YOLOE takes it
                                                                       # for the tomato can (I-025, D-036)
    - {name: 061_foam_brick,      level: 2, x: -0.15, yaw_deg: 0}    # not a pick target: no duplicate of a demo object (I-014)
  wrist_camera:               # D455 on the Franka hand (stage 5): the arm moves to look_joints for the shelf shot
    mount_xyz: [0.0495, -0.0115, 0.066]   # colour lens in the panda_hand frame: body flat on the hand's +x side, glass flush
                                          # with the hand's front, long axis along the fingers' opening (y); looks along +z
    mount_yaw_deg: 90                     # camera x = -hand y, camera y = hand x (shelf shot: robot.look_joints)
  overview:                   # --overview: one still for the docs (whole cell, arm looking at the shelf)
    size: [1600, 1200]
    hfov_deg: 54
    eye: [1.85, 1.95, 1.55]
    target: [0.35, -0.15, 0.42]
    extra_steps: 60
  viewport:                   # --livestream: what the WebRTC client shows
    eye: [2.00, -0.30, 1.30]
    target: [0.35, -0.10, 0.10]
  colors:                     # sRGB 0-1 (as in a colour picker; converted to linear for USD)
    floor: [0.10, 0.12, 0.16]
    backdrop: [0.55, 0.65, 0.80]   # dome light colour = what you see behind the scene
    table: [0.66, 0.64, 0.60]      # light neutral grey: yellow / red / blue items all stand out
    pedestal: [0.08, 0.08, 0.09]
    shelf: [0.78, 0.80, 0.83]      # brushed steel (metallic material)
    fingers: [0.15, 0.15, 0.17]    # the finger extensions
  camera:                     # pinhole RGB-D camera, square pixels, centred principal point (fx of a D435 colour stream)
    width: 640
    height: 480
    fx: 615.0
    eye: [1.15, 0.32, 0.64]   # camera position (world): ~0.95 m from the bottle, all five items in view
    target: [0.60, 0.14, 0.02] # point it looks at (middle of the table workspace)
    rig:                      # RealSense D455 model on a floor tripod (visual only, never in the camera's own view)
      hub_height: 0.60        # leg hub above the floor
      leg_spread: 0.38        # foot distance from the column
      leg_angles_deg: [0, 120, 240]    # chosen so no foot lands under the table
      color: [0.08, 0.08, 0.09]
      metal_color: [0.55, 0.56, 0.58]
  arm_drive:                  # PhysX position drives of panda_joint1-7 (units per degree, as USD stores them)
    stiffness: 400.0          # N m / deg (the asset's value)
    damping: 10.0             # N m s / deg (asset: 80, which lags a moving trajectory by centimetres)
  gripper:                    # Franka Hand finger drive (panda_finger_joint1; joint2 mimics it) + finger-pad friction
    stiffness: 6000.0         # N/m: force = stiffness x (commanded - actual opening), up to max_force
    damping: 100.0
    max_force: 140.0          # N, the real hand's peak grasp force (70 N continuous; the asset caps it at 7.2 N)
    friction: 2.0             # static = dynamic, combine mode max: rubber pads
  settle_steps: 120           # physics steps before each capture (object drop + renderer warm-up)
  physics_dt: 0.01666667      # 60 Hz
